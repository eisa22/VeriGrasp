# Verification module (Stage 13) configuration.
# Overrides the documented defaults in verification/config.py.
# All thresholds are exposed here for the RQ4 sensitivity analysis.

mode: cascade            # cascade | full  (full computes every check for ROC)
approach_axis: [0.0, 0.0, -1.0]   # strictly vertical world-up (camera frame)
seed: 0

# Rectangular suction gripper — centred on the grasp point (not a separate pose).
gripper:
  width_m: 0.120        # pallet-plane u-axis extent (120 mm)
  length_m: 0.060       # pallet-plane v-axis extent (60 mm)
  approach_height_m: 0.150
  safety_margin_m: 0.005

stage1:
  # Segmentation-vs-raw-cloud consistency gate.
  min_valid_fraction: 0.60     # fraction of mask pixels with valid depth
  min_points: 50               # absolute minimum valid mask points
  window_radius_m: 0.03        # planar radius of the window around the grasp point
  min_window_points: 10        # fewer points in the window => fail-closed
  top_percentile: 95.0         # robust local top height (rejects flying pixels)
  top_height_tol_m: 0.03       # allowed deviation from candidate.top_surface_height

box_check:
  # Deterministic, visibility-aware OBB plausibility check (Stage 1).
  inlier_min: 0.80
  surface_dist_median_max_m: 0.02
  extent_rel_dev_max: 0.15
  top_normal_angle_max_deg: 12.0
  min_points_total: 300
  min_coverage: 0.60
  eps_m: 0.01
  near_face_band_m: 0.03
  coverage_grid: 10
  face_visible_min_facing: 0.2

stage2:
  plane_rmse_max_m: 0.0025
  normal_angle_max_deg: 30.0
  normal_scatter_max: 0.20
  min_area_ratio: 0.95          # tolerate small sensor gaps at the footprint rim
  edge_clearance_min_m: null    # null => min(half_width, half_length)
  raster_m: 0.008               # >= depth sampling (~depth/fx ≈ 5 mm) else cells stay empty
  max_empty_cell_fraction: 0.08
  depth_seam_step_m: 0.015
  depth_seam_span_ratio: 0.40
  max_peak_to_valley_m: 0.008
  # Additional physical checks (additive)
  normal_alignment_max_deg: 30.0
  max_peak_to_valley_robust_m: 0.006
  warp_robust_low_pct: 2.5
  warp_robust_high_pct: 97.5
  object_density_kg_m3: 150.0
  vacuum_pressure_pa: 40000.0
  holdability_safety_factor: 2.0
  robust_fit:
    max_iter: 5
    mad_scale: 2.5
    min_points: 12

corridor:
  safety_margin_m: 0.0        # optional expansion on parcel footprint (pipeline)

stage3:
  safety_corridor_height_m: 0.30   # lift height when building corridor (pipeline)
  noise_point_tolerance: 5
  top_band_m: 0.005

soft_score:
  accept_threshold: 0.0
