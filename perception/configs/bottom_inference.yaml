lateral_radius_m: 0.30
min_neighbors: 2
height_tolerance: 0.005
tolerance_m: 0.008
pallet_height_tolerance: 0.030
edge_distance_m: 0.05
scene_pcd_stride: 2
solid_surface:
  slab_m: 0.005                  # 5 mm band thickness for height histogram
  min_points: 40                 # min points per band
  min_fraction: 0.03             # OR 3 % of available points
  min_step_m: 0.030              # parcel-to-neighbour gap (3 cm) to skip side noise
  neighbor_ring_outer_m: 0.10    # search up to 10 cm beyond the OBB footprint
  neighbor_ring_inner_m: 0.010   # but exclude the inner 1 cm rim (where parcel sides project)
  min_component_pixels: 120      # ~30 cm² at 5 mm raster = real surface, not a thin ring
  min_aspect_ratio: 0.25         # band CC must not be a long thin strip
  raster_m: 0.005                # 5 mm/px raster for connectivity check
obb:
  min_points: 50
  max_aspect_ratio: 20.0
audit:
  store_per_neighbor_distances: true
  store_neighbor_top_values: true
