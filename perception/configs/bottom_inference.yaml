lateral_radius_m: 0.30
min_neighbors: 2
height_tolerance: 0.005
tolerance_m: 0.008
pallet_height_tolerance: 0.030
edge_distance_m: 0.05
gradient_neighbor:
  neighbor_radius_m: 0.30         # ring radius around the parcel (metres) - converted to px via mean depth
  neighbor_radius_px: 80          # fallback if neighbor_radius_m is null
  min_plateau_area_px: 300        # plateau must contain >= this many pixels
  edge_dilate_px: 1               # widen Sobel edges by 1 px to seal hair-line gaps
  height_percentile: 95.0         # 'höchster Punkt' per plateau
solid_surface:
  slab_m: 0.005                  # 5 mm band thickness for height histogram
  min_points: 40                 # min points per band
  min_fraction: 0.03             # OR 3 % of available points
  raster_m: 0.005
  min_component_pixels: 120
  min_aspect_ratio: 0.25
obb:
  min_points: 50
  max_aspect_ratio: 20.0
audit:
  store_per_neighbor_distances: true
  store_neighbor_top_values: true
