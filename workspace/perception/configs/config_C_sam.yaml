# Experimentell: DINO + SAM-Grid + Sobel (nicht die Original-Pipeline)
mode: gdino_sam
prompts: ["box", "parcel", "bag", "cardboard box", "shipping box"]
gdino:
  box_threshold: 0.30
  text_threshold: 0.25
  max_box_area_ratio: 0.12
  relative_iou_nms_thresh: 0.30
sam:
  model: "vit_b"
  use_grid: true
  grid_size: 16
  grid_min_area_px: 500
  grid_on_roi_area_frac: 0.04
use_dedup: true
dedup_iou_threshold: 0.90
use_depth_fusion: true
quality_gates:
  min_area_px: 200
  max_area_frac: 0.80
